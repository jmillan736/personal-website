  <body>
    <!-- Set the light/dark class before React loads so the page never flashes
         the wrong theme. Mirrors src/shared/useTheme.js. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.body.classList.add(theme);
      })();
    </script>
    <div id="root"></div>
  </body>
